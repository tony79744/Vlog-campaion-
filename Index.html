<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR AI Companion - Full Master Plan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0a0e14; font-family: sans-serif; }

    /* फॉलबैक कैमरा (जब WebXR शुरू न हुआ हो और Gemini Vision फ्रेम कैप्चर के लिए) */
    #camera-feed {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    /* 3D AR कैनवास */
    #ar-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: auto;
    }

    /* मुख्य AR ओवरले UI */
    #overlay-ui {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px;
    }

    /* ऊपर की पट्टी: API Key, स्टेटस और स्ट्रेंजर लॉक */
    #top-bar {
      pointer-events: auto;
      display: flex; gap: 6px; align-items: center;
      background: rgba(15, 20, 28, 0.85); padding: 8px 10px;
      border-radius: 12px; border: 1px solid rgba(0, 230, 118, 0.35);
      backdrop-filter: blur(6px);
    }
    #status-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #00e676; flex-shrink: 0;
    }
    #api-key {
      flex: 1; background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25); color: #fff;
      padding: 6px 8px; border-radius: 8px; font-size: 12px;
    }
    .mini-btn {
      background: #00e676; color: #000; border: none;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold;
    }
    .mini-btn.locked { background: #ff1744; color: #fff; }

    /* संवाद और सबटाइटल बॉक्स */
    #dialogue-box {
      pointer-events: auto;
      background: rgba(18, 24, 32, 0.9); color: #00e676;
      padding: 12px 16px; border-radius: 14px;
      border-left: 4px solid #00e676;
      font-size: 14px; line-height: 1.45; text-align: left;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      margin-top: 8px;
    }

    /* पोकेमॉन गो स्टाइल फ्लोर AR चालू करने का मुख्य बटन */
    #start-ar-btn {
      pointer-events: auto; align-self: center;
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #000; font-weight: bold; font-size: 15px;
      padding: 15px 24px; border-radius: 30px; border: none;
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.55);
    }

    /* नीचे के सभी गेम कंट्रोल्स */
    #bottom-panel {
      pointer-events: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn-row {
      display: flex; gap: 6px; justify-content: space-between;
    }
    .ctrl-btn {
      flex: 1; background: rgba(18, 24, 34, 0.88); color: #fff;
      border: 1.5px solid rgba(0, 230, 118, 0.5);
      padding: 10px 6px; border-radius: 20px;
      font-size: 12px; font-weight: bold; text-align: center;
    }
    .ctrl-btn.active { background: #00e676; color: #000; }
    .ctrl-btn.rec-active { background: #ff1744; color: #fff; border-color: #ff5252; }
  </style>
</head>
<body>

  <!-- बैकग्राउंड कैमरा और Gemini Vision स्नैपशॉट कैनवास -->
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <!-- मुख्य इंटरफेस (AR के अंदर भी दिखेगा) -->
  <div id="overlay-ui">
    <div>
      <div id="top-bar">
        <div id="status-dot"></div>
        <input type="password" id="api-key" placeholder="Gemini API Key यहाँ डालें">
        <button class="mini-btn" onclick="saveApiKey(event)">Save</button>
        <button class="mini-btn" id="stranger-btn" onclick="toggleStrangerLock(event)">🔓 Owner</button>
      </div>

      <div id="dialogue-box">
        साथी: "मैं आपकी AI व्लॉगिंग साथी हूँ! असली ज़मीन पर मुझे खड़ा करने के लिए नीचे हरे बटन पर टैप करें।"
      </div>
    </div>

    <button id="start-ar-btn" onclick="startRealFloorAR(event)">
      ⚡ असली फ्लोर AR चालू करें (Pokémon GO Mode)
    </button>

    <div id="bottom-panel">
      <div class="btn-row">
        <button class="ctrl-btn" id="roam-btn" onclick="toggleRoam(event)">🚶 खुद घूमो</button>
        <button class="ctrl-btn" id="sit-btn" onclick="toggleSit(event)">🪑 बैठो / उठो</button>
        <button class="ctrl-btn" onclick="triggerProactiveVision(true, event)">👁️ सामने देखो</button>
        <button class="ctrl-btn" onclick="testPersonalSpace(event)">📏 1.5ft टेस्ट</button>
      </div>
      <div class="btn-row">
        <button class="ctrl-btn" onclick="startVoiceTalk(event)">🗣️ बात करें</button>
        <button class="ctrl-btn" id="rec-btn" onclick="toggleRecording(event)">⏺️ रिकॉर्डिंग</button>
        <button class="ctrl-btn" onclick="recenterToFloor(event)">🔄 सेंटर लाएं</button>
      </div>
    </div>
  </div>

  <!-- Three.js और GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // =========================================================================
    // PHASE 1: 1-CLICK PREFAB REPLACE (डमी मॉडल या असली .GLB मॉडल लिंक)
    // =========================================================================
    const CHARACTER_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb';

    let scene, camera, renderer, clock, mixer;
    let character, reticle, shadowPlane;
    let greenZoneCollider, redZoneCollider;
    let animations = {}, currentAction = null;

    // WebXR Hit-Test (असली ज़मीन पहचानने के वेरिएबल्स)
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let isRealARActive = false;
    let isPlacedOnFloor = false;

    // मूवमेंट और स्टेट वेरिएबल्स
    let isWalking = false;
    let isRoaming = false;
    let isSitting = false;
    let strangerLock = false;
    let targetPosition = new THREE.Vector3(0, -1.1, -2.5);
    let roamWaitTimer = 0;
    let idleShiftTimer = 0;
    let proximityCooldown = 0;

    // साइलेंस टाइमर (Phase 5: 10 सेकंड सन्नाटा डिटेक्टर)
    let silenceTimer = null;
    const SILENCE_DELAY = 10000;

    // रिकॉर्डिंग वेरिएबल्स (Phase 6)
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // सेव की गई Gemini Key लोड करें
    document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || '';

    function saveApiKey(e) {
      if (e) e.stopPropagation();
      const val = document.getElementById('api-key').value.trim();
      localStorage.setItem('GEMINI_API_KEY', val);
      speakDialogue("आपकी जेमिनी एपीआई की सेव हो गई है! अब मैं हर दस सेकंड में माहौल देखकर खुद बात करूँगी।");
      resetSilenceTimer();
    }

    // =========================================================================
    // PHASE 2: CAMERA, THREE.JS SCENE & REAL-TIME FLOOR SHADOWS
    // =========================================================================
    async function startFallbackCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        document.getElementById('camera-feed').srcObject = stream;
      } catch (err) {
        console.log("Camera waiting for user permission.");
      }
    }

    function initMasterScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 50);
      camera.position.set(0, 0.4, 0);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.xr.enabled = true;
      renderer.domElement.id = 'ar-canvas';
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      // रियल-टाइम लाइट और ज़मीन की परछाई
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 8, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(2, 6, 2);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      // पारदर्शी शैडो कैचर फर्श (ज़मीन पर असली परछाई के लिए)
      const floorGeo = new THREE.PlaneGeometry(25, 25);
      const floorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
      shadowPlane = new THREE.Mesh(floorGeo, floorMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -1.1;
      shadowPlane.receiveShadow = true;
      shadowPlane.name = "SHADOW_FLOOR";
      scene.add(shadowPlane);

      // पोकेमॉन गो जैसा ज़मीन स्कैन करने वाला हरा टारगेट रिंग (Reticle)
      const ringGeo = new THREE.RingGeometry(0.14, 0.20, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e676, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // 3D कैरेक्टर लोड करना
      const loader = new THREE.GLTFLoader();
      loader.load(CHARACTER_URL, (gltf) => {
        character = gltf.scene;
        character.position.copy(targetPosition);
        character.scale.set(0.9, 0.9, 0.9);

        character.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
        scene.add(character);

        mixer = new THREE.AnimationMixer(character);
        gltf.animations.forEach((clip) => {
          animations[clip.name] = mixer.clipAction(clip);
        });
        playAnimation('idle');
        createBodyZoneColliders();
      });

      window.addEventListener('pointerdown', onScreenTap);
      window.addEventListener('resize', onResize);

      resetSilenceTimer();
      renderer.setAnimationLoop(masterRenderLoop);
    }

    // =========================================================================
    // PHASE 4: GREEN ZONE, RED ZONE & STRANGER LOCK COLLIDERS
    // =========================================================================
    function createBodyZoneColliders() {
      const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });

      // ग्रीन ज़ोन (सिर, कंधे और हाथ)
      greenZoneCollider = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), hiddenMat);
      greenZoneCollider.position.set(0, 1.52, 0);
      greenZoneCollider.name = "GREEN_ZONE";
      character.add(greenZoneCollider);

      // रेड ज़ोन (कमर और संवेदनशील हिस्सा)
      redZoneCollider = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.56, 12), hiddenMat);
      redZoneCollider.position.set(0, 0.92, 0);
      redZoneCollider.name = "RED_ZONE";
      character.add(redZoneCollider);
    }

    function toggleStrangerLock(e) {
      if (e) e.stopPropagation();
      strangerLock = !strangerLock;
      const btn = document.getElementById('stranger-btn');
      if (strangerLock) {
        btn.innerText = "🔒 Stranger";
        btn.classList.add('locked');
        speakDialogue("स्ट्रेंजर लॉक चालू हो गया है! अब मालिक के अलावा कोई भी मुझे छुएगा तो मैं सख्त आपत्ति करूँगी।");
      } else {
        btn.innerText = "🔓 Owner";
        btn.classList.remove('locked');
        speakDialogue("मालिक की पहचान हो गई है। स्ट्रेंजर लॉक बंद कर दिया गया है।");
      }
    }

    // =========================================================================
    // POKÉMON GO STYLE REAL FLOOR AR SESSION (WebXR Hit-Test)
    // =========================================================================
    async function startRealFloorAR(e) {
      if (e) e.stopPropagation();
      if (!navigator.xr) {
        speakDialogue("आपके ब्राउज़र में WebXR उपलब्ध नहीं है, अभी सामान्य कैमरा मोड चल रहा है।");
        return;
      }
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.getElementById('overlay-ui') }
        });

        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);

        isRealARActive = true;
        isPlacedOnFloor = false;
        if (character) character.visible = false;
        document.getElementById('camera-feed').style.display = 'none';
        document.getElementById('start-ar-btn').style.display = 'none';

        speakDialogue("फोन को फर्श की तरफ दिखाएं और हल्का हिलाएं। हरा घेरा दिखने पर टैप करके मुझे असली ज़मीन पर खड़ा करें!");

        session.addEventListener('end', () => {
          isRealARActive = false;
          hitTestSourceRequested = false;
          hitTestSource = null;
          reticle.visible = false;
          document.getElementById('camera-feed').style.display = 'block';
          document.getElementById('start-ar-btn').style.display = 'block';
          if (character) {
            character.visible = true;
            character.position.set(0, -1.1, -2.5);
            targetPosition.copy(character.position);
          }
        });
      } catch (err) {
        speakDialogue("असली फ्लोर AR के लिए Google Play Services for AR ज़रूरी है। अभी सामान्य मोड में ज़मीन पर टैप करके चलाएं।");
      }
    }

    // =========================================================================
    // TOUCH INTERACTION & FLOOR WALKING
    // =========================================================================
    function onScreenTap(event) {
      if (event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT') return;
      resetSilenceTimer();
      if (!character) return;

      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera(camera) : camera;
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, activeCam);

      // 1. पहले चेक करें कि क्या कैरेक्टर के शरीर (Green/Red Zone) को छुआ गया है
      if (character.visible) {
        const bodyHits = raycaster.intersectObjects([greenZoneCollider, redZoneCollider], true);
        if (bodyHits.length > 0) {
          const hitZone = bodyHits[0].object.name;

          // अगर स्ट्रेंजर लॉक चालू है तो किसी भी टच पर सख्त विरोध
          if (strangerLock) {
            stepBackDefensively(activeCam, "रुकिए! मैं आपको नहीं जानती। बिना अनुमति मुझे छूने की कोशिश मत कीजिए!");
            return;
          }

          if (hitZone === "GREEN_ZONE") {
            isWalking = false;
            playAnimation('agree');
            speakDialogue("हाय दोस्त! सिर थपथपाने और हाथ मिलाने के लिए शुक्रिया। बताइए आज कहाँ चलना है?");
            setTimeout(() => { if (!isWalking) playAnimation('idle'); }, 2300);
            return;
          } else if (hitZone === "RED_ZONE") {
            stepBackDefensively(activeCam, "पीछे हटिए! इस तरह गलत जगह छूना बिल्कुल मना है। अपनी बाउंड्री में रहिए!");
            return;
          }
        }
      }

      // 2. असली AR मोड में हरे घेरे (Reticle) पर कैरेक्टर को खड़ा करना या चलाना
      if (isRealARActive && reticle.visible) {
        const floorPos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        if (!isPlacedOnFloor) {
          character.position.copy(floorPos);
          targetPosition.copy(floorPos);
          shadowPlane.position.copy(floorPos);
          character.visible = true;
          isPlacedOnFloor = true;
          playAnimation('idle');
          speakDialogue("मैं आपकी असली ज़मीन पर लॉक हो गई हूँ! अब कैमरा कहीं भी घुमाएं, मैं यहीं टिकी रहूँगी।");
        } else {
          isSitting = false;
          document.getElementById('sit-btn').classList.remove('active');
          targetPosition.copy(floorPos);
          shadowPlane.position.y = floorPos.y;
          isWalking = true;
          playAnimation('walk');
        }
        return;
      }

      // 3. सामान्य कैमरा मोड में फर्श पर टैप करके चलाना
      if (!isRealARActive) {
        const floorHits = raycaster.intersectObject(shadowPlane);
        if (floorHits.length > 0) {
          const pt = floorHits[0].point;
          if (pt.z < -0.7 && pt.z > -7.5) {
            isSitting = false;
            targetPosition.set(pt.x, -1.1, pt.z);
            isWalking = true;
            playAnimation('walk');
          }
        }
      }
    }

    // रेड ज़ोन या स्ट्रेंजर टच पर तुरंत 2 कदम पीछे हटना
    function stepBackDefensively(activeCam, message) {
      isSitting = false;
      const camPos = new THREE.Vector3();
      activeCam.getWorldPosition(camPos);
      const awayDir = new THREE.Vector3().subVectors(character.position, camPos).normalize();
      awayDir.y = 0;
      if (awayDir.lengthSq() === 0) awayDir.set(0, 0, -1);

      targetPosition.copy(character.position).addScaledVector(awayDir, 0.75);
      playAnimation('headShake');
      speakDialogue(message);
      setTimeout(() => {
        isWalking = true;
        playAnimation('walk');
      }, 500);
    }

    // =========================================================================
    // PHASE 3 & 4: ROAM, SIT, SEAT PROTECTION & 1.5FT PERSONAL SPACE
    // =========================================================================
    function toggleRoam(e) {
      if (e) e.stopPropagation();
      resetSilenceTimer();
      if (!character || !character.visible) {
        speakDialogue("पहले ज़मीन पर हरा घेरा देखकर मुझे खड़ा करें!");
        return;
      }
      isRoaming = !isRoaming;
      document.getElementById('roam-btn').classList.toggle('active', isRoaming);

      if (isRoaming) {
        isSitting = false;
        document.getElementById('sit-btn').classList.remove('active');
        chooseNextRoamPoint();
        speakDialogue("ठीक है, अब मैं आपके फर्श पर अपने आप इधर-उधर घूमूँगी!");
      } else {
        isWalking = false;
        playAnimation('idle');
        speakDialogue("मैं एक जगह रुक गई हूँ।");
      }
    }

    function chooseNextRoamPoint() {
      const angle = Math.random() * Math.PI * 2;
      const dist = 0.55 + Math.random() * 0.85;
      targetPosition.set(
        character.position.x + Math.cos(angle) * dist,
        character.position.y,
        character.position.z + Math.sin(angle) * dist
      );
      isWalking = true;
      playAnimation('walk');
    }

    function toggleSit(e) {
      if (e) e.stopPropagation();
      resetSilenceTimer();
      if (!character || !character.visible) return;

      isSitting = !isSitting;
      isRoaming = false;
      document.getElementById('roam-btn').classList.remove('active');
      document.getElementById('sit-btn').classList.toggle('active', isSitting);

      if (isSitting) {
        isWalking = false;
        playAnimation('sneak_pose');
        speakDialogue("मैं यहाँ आराम से बैठ गई हूँ। अगर कोई मेरी सीट छीनेगा तो मैं तुरंत उठ जाऊँगी!");
      } else {
        playAnimation('idle');
        speakDialogue("चलो, अब उठकर आगे चलते हैं!");
      }
    }

    // 1.5 फीट पर्सनल स्पेस और सीट चोरी प्रोटेक्शन टेस्ट
    function testPersonalSpace(e) {
      if (e) e.stopPropagation();
      resetSilenceTimer();
      if (!character || !character.visible) return;

      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera(camera) : camera;
      triggerPersonalSpaceReaction(activeCam);
    }

    function triggerPersonalSpaceReaction(ac
