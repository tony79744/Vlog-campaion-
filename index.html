<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR AI Vlogging Companion</title>
  <!-- Three.js और GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    /* बैकग्राउंड कैमरा फ़ीड */
    #camera-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 3D कैनवास */
    #three-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    /* ऑन-स्क्रीन कंट्रोल बार */
    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn {
      background: rgba(20, 20, 20, 0.75);
      border: 2px solid #fff;
      color: #fff;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .btn-record.recording {
      background: #e74c3c;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    #status-box {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #00ffcc;
      border-radius: 12px;
      font-size: 13px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- कैमरा वीडियो -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- 3D AR सीन -->
  <canvas id="three-canvas"></canvas>

  <!-- स्थिति और सबटाइटल -->
  <div id="status-box">स्थिति: कैमरा और AR सिस्टम शुरू हो रहा है...</div>

  <!-- कंट्रोल बटन -->
  <div class="controls">
    <button class="btn" id="talk-btn" onclick="toggleSpeech()">🎙️ बात करें</button>
    <button class="btn btn-record" id="rec-btn" onclick="toggleRecord()">⏺️ रिकॉर्डिंग</button>
    <button class="btn" onclick="resetCharacterPos()">🔄 रीसेट जगह</button>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('three-canvas');

    let scene, camera, renderer, model, mixer;
    let clock = new THREE.Clock();
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    // --- 1. बैकग्राउंड कैमरा सेटअप ---
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true
        });
        video.srcObject = stream;
        statusBox.innerText = "कैमरा सक्रिय। 3D मॉडल लोड हो रहा है...";
      } catch (err) {
        statusBox.innerText = "कैमरा अनुमति अस्वीकृत या उपलब्ध नहीं: " + err.message;
      }
    }

    // --- 2. Three.js AR सीन सेटअप ---
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.4, 2.5);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // प्राकृतिक प्रकाश (Light Estimation)
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(2, 4, 3);
      scene.add(dirLight);

      // 3D मॉडल लोडर (डिफ़ॉल्ट मुफ़्त ग्लिफ़ रोबोट मॉडल)
      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

      loader.load(modelUrl, (gltf) => {
        model = gltf.scene;
        model.scale.set(0.35, 0.35, 0.35);
        model.position.set(0.5, -0.6, 0); // स्क्रीन के दाईं तरफ व्लॉगिंग पार्टनर की तरह
        scene.add(model);

        // एनिमेशन मिक्सर (Idle/Wave)
        mixer = new THREE.AnimationMixer(model);
        if (gltf.animations.length > 0) {
          const idleAction = mixer.clipAction(gltf.animations.find(a => a.name === 'Idle') || gltf.animations[0]);
          idleAction.play();
        }

        statusBox.innerText = "साथी तैयार है! बात करने के लिए 🎙️ दबाएं।";
      }, undefined, (err) => {
        statusBox.innerText = "मॉडल लोड करने में त्रुटि: " + err.message;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      // सांस लेने का सूक्ष्म मोशन (Living Idle)
      if (model) {
        model.position.y += Math.sin(Date.now() * 0.003) * 0.0004;
      }

      renderer.render(scene, camera);
    }

    // मॉडल की जगह स्क्रीन पर टच करके रीसेट करना
    function resetCharacterPos() {
      if (model) {
        model.position.set(0.4, -0.6, 0);
        statusBox.innerText = "कैरेक्टर की स्थिति रीसेट कर दी गई।";
      }
    }

    // --- 3. वॉइस इंटरैक्शन (AI Companion Logic) ---
    const recognition = ('webkitSpeechRecognition' in window) ? new webkitSpeechRecognition() : null;
    let isListening = false;

    if (recognition) {
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        statusBox.innerText = `आपने कहा: "${transcript}"`;
        botReply(transcript);
      };
      recognition.onerror = function() {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      };
      recognition.onend = function() {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert("आपका ब्राउज़र वॉइस पहचान का समर्थन नहीं करता। Chrome का प्रयोग करें।");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
        isListening = true;
        document.getElementById('talk-btn').innerText = "🔴 सुन रहा है...";
        statusBox.innerText = "बोलिए, आपका साथी सुन रहा है...";
      }
    }

    function botReply(userText) {
      statusBox.innerText = "साथी सोच रहा है...";
      
      // सामान्य व्लॉगिंग जवाब (इसे आप अपनी Gemini API Key जोड़कर लाइव विज़न AI बना सकते हैं)
      let reply = "हाँ, मौसम बहुत बढ़िया लग रहा है! आगे क्या दिखाने वाले हैं?";
      if (userText.includes("खाना") || userText.includes("होटल")) {
        reply = "अरे वाह, खाना बहुत स्वादिष्ट लग रहा है! रिव्यू में क्या बताने वाले हैं?";
      } else if (userText.includes("कहाँ") || userText.includes("रास्ता")) {
        reply = "हम सही रास्ते पर हैं, आप कैमरे में दर्शकों से बात जारी रखिए।";
      }

      setTimeout(() => {
        speakResponse(reply);
      }, 700);
    }

    function speakResponse(text) {
      statusBox.innerText = `साथी: "${text}"`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // --- 4. इन-ऐप स्क्रीन रिकॉर्डर (NatCorder का वेब विकल्प) ---
    async function toggleRecord() {
      const recBtn = document.getElementById('rec-btn');
      if (!isRecording) {
        recordedChunks = [];

        // कंपोज़िट कैनवास: कैमरा + Three.js दोनों को एक साथ रिकॉर्ड करना
        const recordCanvas = document.createElement('canvas');
        recordCanvas.width = 1280;
        recordCanvas.height = 720;
        const ctx = recordCanvas.getContext('2d');

        function drawFrame() {
          if (!isRecording) return;
          ctx.drawImage(video, 0, 0, recordCanvas.width, recordCanvas.height);
          ctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
          requestAnimationFrame(drawFrame);
        }

        isRecording = true;
        drawFrame();

        const canvasStream = recordCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `vlog_companion_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
          }, 100);
          statusBox.innerText = "रिकॉर्डेड वीडियो फ़ोन में डाउनलोड हो गई है!";
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹️ रोकें व सेव करें";
        recBtn.classList.add('recording');
        statusBox.innerText = "व्लॉग रिकॉर्डिंग चालू है...";
      } else {
        isRecording = false;
        mediaRecorder.stop();
        recBtn.innerText = "⏺️ रिकॉर्डिंग";
        recBtn.classList.remove('recording');
      }
    }

    // स्टार्ट
    window.addEventListener('load', () => {
      startCamera();
      initThree();
    });

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
