<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR AI Vlog Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100dvh; overflow: hidden; background: #0a0e14; font-family: system-ui, sans-serif; }
    #camera-feed { position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; background: #000; }
    #camera-feed.mirror { transform: scaleX(-1); }
    #ar-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 2; pointer-events: none; }
    #overlay-ui { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
    #top-section, #bottom-panel { display: flex; flex-direction: column; gap: 5px; pointer-events: auto; }
    #top-bar { display: flex; gap: 5px; align-items: center; background: rgba(12,18,28,0.88); padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(0,230,118,0.4); }
    #status-dot { width: 11px; height: 11px; border-radius: 50%; background: #00e676; flex-shrink: 0; box-shadow: 0 0 8px #00e676; }
    #status-dot.listening { background: #ff9100; box-shadow: 0 0 12px #ff9100; }
    #api-key { flex: 1; min-width: 65px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 5px 7px; border-radius: 7px; font-size: 11px; }
    .mini-btn { background: #00e676; color: #000; border: none; padding: 5px 9px; border-radius: 7px; font-size: 11px; font-weight: bold; }
    .mini-btn.secondary { background: #00b0ff; color: #000; }
    #dialogue-box { background: rgba(10,14,22,0.88); color: #00e676; padding: 8px 12px; border-radius: 10px; border-left: 4px solid #00e676; font-size: 13px; line-height: 1.35; }
    #chat-row { display: flex; gap: 5px; background: rgba(12,18,28,0.92); padding: 5px; border-radius: 20px; border: 1px solid rgba(0,230,118,0.45); }
    #text-input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px 10px; font-size: 12.5px; outline: none; user-select: text; }
    #send-btn { background: #00e676; color: #000; border: none; padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; }
    .btn-row { display: flex; gap: 6px; justify-content: space-between; }
    .ctrl-btn { flex: 1; background: rgba(15,22,32,0.92); color: #fff; border: 1.2px solid #00e676; padding: 8px 4px; border-radius: 16px; font-size: 11.5px; font-weight: bold; text-align: center; }
    .ctrl-btn.active { background: #00e676; color: #000; }
    .ctrl-btn.danger { background: #ff1744; border-color: #ff1744; color: #fff; }
  </style>
</head>
<body>
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>
  <div id="overlay-ui">
    <div id="top-section">
      <div id="top-bar">
        <div id="status-dot"></div>
        <input type="password" id="api-key" placeholder="Gemini API Key डालें">
        <button class="mini-btn" onclick="saveApiKey()">Save</button>
        <button class="mini-btn secondary" onclick="switchCamera()">📷 कैमरा</button>
      </div>
      <div id="dialogue-box">आर्या: "नमस्ते! एपीआई की सेव करके माइक चालू करें।"</div>
    </div>
    <div id="bottom-panel">
      <div id="chat-row">
        <input type="text" id="text-input" placeholder="सीधे बोलें या यहाँ लिखें..." onkeydown="if(event.key==='Enter') sendTextChat()">
        <button id="send-btn" onclick="sendTextChat()">भेजें</button>
      </div>
      <div class="btn-row">
        <button class="ctrl-btn" id="mic-btn" onclick="toggleContinuousVoice()">🎙️ लाइव बातचीत शुरू करें</button>
        <button class="ctrl-btn" onclick="recenterCharacter()">🔄 सामने लाएं</button>
        <button class="ctrl-btn" id="rec-btn" onclick="toggleRecording()">⏺️ व्लॉग रिकॉर्ड</button>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const MODEL_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Michelle.glb';
    let scene, camera, renderer, clock, mixer, character, danceAction, floorGroup, greenRing;
    let bones = {}, allBones = [], baseY = 0, heightOffset = 0, sideTarget = 0, currentDist = 2.4, facingMode = 'environment';
    let currentPose = 'STAND', isSpeaking = false, hasGyro = false, rawAlpha = 0, alphaOffset = null, anchorAngle = 0;
    const targetCamQuat = new THREE.Quaternion(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler();
    let recognition = null, isListening = false, mediaRecorder = null, recordedChunks = [], isRecording = false;

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY'] || '';
      initScene(); startCamera(facingMode); initGyro(); initVoice();
    });

    function updateDialogue(t) { document.getElementById('dialogue-box').innerText = 'आर्या: "' + t + '"'; }
    function speakDialogue(t) {
      updateDialogue(t);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = 'hi-IN';
        u.onstart = () => { isSpeaking = true; };
        u.onend = () => { isSpeaking = false; };
        u.onerror = () => { isSpeaking = false; };
        window.speechSynthesis.speak(u);
      }
    }
    function saveApiKey() {
      localStorage.setItem('GEMINI_API_KEY', document.getElementById('api-key').value.trim());
      speakDialogue('एपीआई की सेव हो गई है! अब माइक चालू करें।');
    }
    function initGyro() {
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        hasGyro = true; rawAlpha = e.alpha;
        if (alphaOffset === null) alphaOffset = rawAlpha;
        const a = THREE.MathUtils.degToRad(e.alpha - alphaOffset), b = THREE.MathUtils.degToRad(e.beta), g = THREE.MathUtils.degToRad(e.gamma);
        const orient = THREE.MathUtils.degToRad(window.orientation || (screen.orientation && screen.orientation.angle) || 0);
        euler.set(b, a, -g, 'YXZ');
        targetCamQuat.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(zee, -orient));
      }, true);
    }
    async function startCamera(mode) {
      const v = document.getElementById('camera-feed');
      if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; await new Promise(r => setTimeout(r, 250)); }
      for (const c of [{ video: { facingMode: { exact: mode } } }, { video: { facingMode: mode } }, { video: true }]) {
        try { v.srcObject = await navigator.mediaDevices.getUserMedia(c); v.classList.toggle('mirror', mode === 'user'); await v.play(); return; } catch (e) {}
      }
    }
    async function switchCamera() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      await startCamera(facingMode);
      speakDialogue(facingMode === 'user' ? 'फ्रंट कैमरा चालू है!' : 'बैक कैमरा चालू है!');
    }

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 50);
      camera.position.set(0, 1.15, 0); camera.lookAt(0, 0.85, -2.4); targetCamQuat.copy(camera.quaternion);
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.domElement.id = 'ar-canvas'; document.body.appendChild(renderer.domElement);
      clock = new THREE.Clock();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.4));
      const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(2, 5, 3); scene.add(dl);
      floorGroup = new THREE.Group(); floorGroup.position.set(0, 0, -2.4); scene.add(floorGroup);
      greenRing = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.39, 36).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x00e676, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
      greenRing.position.y = 0.01; floorGroup.add(greenRing);

      new THREE.GLTFLoader().load(MODEL_URL, (gltf) => {
        character = gltf.scene; floorGroup.add(character);
        mixer = new THREE.AnimationMixer(character);
        danceAction = mixer.clipAction(gltf.animations[0]);
        danceAction.play(); danceAction.time = 0; mixer.update(0.001); danceAction.paused = true;
        character.traverse((o) => {
          if (o.isBone) {
            o.userData.initQuat = o.quaternion.clone(); allBones.push(o);
            const n = o.name;
            if (n.includes('Spine1')) bones.spine1 = o;
            if (n.includes('Neck')) bones.neck = o;
            if (n.includes('Head')) bones.head = o;
            if (n.includes('LeftArm')) bones.leftArm = o;
            if (n.includes('RightArm')) bones.rightArm = o;
            if (n.includes('LeftForeArm')) bones.leftForeArm = o;
            if (n.includes('RightForeArm')) bones.rightForeArm = o;
            if (n.includes('LeftUpLeg')) bones.leftUpLeg = o;
            if (n.includes('RightUpLeg')) bones.rightUpLeg = o;
            if (n.includes('LeftLeg')) bones.leftLeg = o;
            if (n.includes('RightLeg')) bones.rightLeg = o;
          }
        });
        baseY = -new THREE.Box3().setFromObject(character).min.y; character.position.y = baseY;
      });
      window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
      renderer.setAnimationLoop(renderLoop);
    }

    function applyPose(pose) {
      if (pose === 'UP') { heightOffset += 0.18; return; }
      if (pose === 'DOWN') { heightOffset -= 0.18; return; }
      if (pose === 'NEAR') { currentDist = 1.65; sideTarget = 0.35; return; }
      if (pose === 'FAR') { currentDist = 3.2; sideTarget = 0; return; }
      if (pose === 'CENTER') { recenterCharacter(); return; }
      currentPose = pose;
      if (pose === 'STAND') heightOffset = 0;
      if (danceAction) { danceAction.time = 0; danceAction.paused = (pose !== 'DANCE'); danceAction.timeScale = 1; }
    }
    function recenterCharacter() {
      currentPose = 'STAND'; heightOffset = 0; sideTarget = 0; currentDist = 2.4;
      if (danceAction) danceAction.paused = true;
      if (hasGyro) alphaOffset = rawAlpha; anchorAngle = 0;
    }

    function initVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      recognition = new SR(); recognition.lang = 'hi-IN'; recognition.continuous = false; recognition.interimResults = false;
      recognition.onstart = () => document.getElementById('status-dot').classList.add('listening');
      recognition.onresult = (ev) => { const t = ev.results[0][0].transcript.trim(); if (t) handleUserMessage(t); };
      recognition.onerror = () => {};
      recognition.onend = () => {
        document.getElementById('status-dot').classList.remove('listening');
        if (isListening) setTimeout(() => { try { if (!isSpeaking) recognition.start(); else setTimeout(() => recognition.start(), 1500); } catch (e) {} }, 500);
      };
    }
    function toggleContinuousVoice() {
      if (!recognition) return speakDialogue('चैट बॉक्स में लिखकर बात करें।');
      isListening = !isListening;
      const b = document.getElementById('mic-btn');
      b.classList.toggle('active', isListening); b.innerText = isListening ? '🎙️ लाइव माइक: चालू है' : '🎙️ लाइव बातचीत शुरू करें';
      if (isListening) { try { recognition.start(); } catch (e) {} speakDialogue('माइक चालू है, अब बोलिए!'); }
      else { try { recognition.stop(); } catch (e) {} }
    }
    function sendTextChat() { const inp = document.getElementById('text-input'), t = inp.value.trim(); if (!t) return; inp.value = ''; handleUserMessage(t); }

    async function askGemini(parts) {
      const key = localStorage.getItem('GEMINI_API_KEY');
      for (const m of ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash']) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] })
          });
          const d = await r.json(), txt = d?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join(' ');
          if (txt) return txt.replace(/[*#]/g, '').trim();
        } catch (e) {}
      }
      return null;
    }

    async function handleUserMessage(text) {
      updateDialogue('आपने कहा: "' + text + '"');
      const key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) return speakDialogue('कृपया ऊपर API Key डालकर Save दबाएं!');

      const l = text.toLowerCase();
      const needCam = l.includes('सामने देख') || l.includes('क्या दिख') || l.includes('मेरे हाथ में');
      const parts = [{ text: `तुम "आर्या" हो, एक स्मार्ट 3D AR साथी। यूजर ने कहा: "${text}"। 
साधारण बातचीत, ताज़ा न्यूज़ या सवालों का 1-2 छोटे वाक्यों में स्वाभाविक हिंदी में जवाब दो।
साथ ही अगर यूजर मूवमेंट बोले तो इनमें से एक पोज़ चुनो, वरना KEEP लिखो:
STAND, CHAIR, BENCH, BIKE, GROUND, ROAM, DANCE, WAVE, NEAR, FAR, UP, DOWN, CENTER, KEEP.
हमेशा इसी फॉर्मेट में जवाब दो:
POSE: [यहाँ पोज़ लिखो]
REPLY: [यहाँ हिंदी जवाब लिखो]` }];

      if (needCam) {
        const v = document.getElementById('camera-feed'), c = document.getElementById('capture-canvas');
        c.width = 480; c.height = 360; c.getContext('2d').drawImage(v, 0, 0, 480, 360);
        parts.push({ inline_data: { mime_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.7).split(',')[1] } });
      }

      const res = await askGemini(parts);
      if (!res) return speakDialogue('इंटरनेट या एपीआई की जांच करें।');
      const pm = res.match(/POSE:\s*([A-Z]+)/i), rm = res.match(/REPLY:\s*([\s\S]+)/i);
      const pose = pm ? pm[1].toUpperCase() : 'KEEP';
      const reply = rm ? rm[1].trim() : res.replace(/POSE:\s*[A-Z]+/i, '').trim();
      if (pose !== 'KEEP') applyPose(pose);
      speakDialogue(reply);
    }

    function toggleRecording() {
      const b = document.getElementById('rec-btn');
      if (!isRecording) {
        try {
          mediaRecorder = new MediaRecorder(renderer.domElement.captureStream(30)); recordedChunks = [];
          mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
          mediaRecorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' })); a.download = 'ar-vlog.webm'; a.click(); };
          mediaRecorder.start(); isRecording = true; b.classList.add('danger'); b.innerText = '⏹️ सेव करें'; speakDialogue('रिकॉर्डिंग शुरू!');
        } catch (e) { speakDialogue('रिकॉर्डिंग उपलब्ध नहीं है।'); }
      } else { mediaRecorder.stop(); isRecording = false; b.classList.remove('danger'); b.innerText = '⏺️ व्लॉग रिकॉर्ड'; speakDialogue('वीडियो सेव हो गई!'); }
    }

    function renderLoop() {
      const dt = clock.getDelta(), el = clock.getElapsedTime();
      if (hasGyro) camera.quaternion.slerp(targetCamQuat, 0.28);
      if (!character) { renderer.render(scene, camera); return; }

      const roamX = (currentPose === 'ROAM') ? Math.sin(el * 0.75) * 0.65 : sideTarget;
      floorGroup.position.x = THREE.MathUtils.lerp(floorGroup.position.x, Math.sin(anchorAngle) * currentDist + roamX, dt * 5);
      floorGroup.position.z = THREE.MathUtils.lerp(floorGroup.position.z, -Math.cos(anchorAngle) * currentDist, dt * 5);
      floorGroup.lookAt(camera.position.x, 0, camera.position.z);

      if (currentPose === 'DANCE') { mixer.update(dt); character.position.y = baseY + heightOffset; }
      else {
        for (const b of allBones) b.quaternion.copy(b.userData.initQuat);
        let yMod = 0;
        if (currentPose === 'CHAIR') yMod = -0.36;
        else if (currentPose === 'BENCH') yMod = -0.32;
        else if (currentPose === 'BIKE') yMod = 0.12;
        else if (currentPose === 'GROUND') yMod = -0.68;
        character.position.y = THREE.MathUtils.lerp(character.position.y, baseY + yMod + heightOffset, dt * 6);

        if (bones.spine1) bones.spine1.rotateX(Math.sin(el * 2.2) * 0.02);
        if (bones.neck) bones.neck.rotateY(Math.sin(el * 0.9) * 0.06);
        if (bones.head) {
          bones.head.rotateY(Math.sin(el * 0.9) * 0.10);
          bones.head.rotateX(isSpeaking ? Math.sin(el * 6) * 0.06 : Math.sin(el * 1.6) * 0.03);
        }
        // हाथ का डिसफिगर दिखना पूरी तरह ठीक किया गया (अब हाथ अपनी जगह नॉर्मल रहेंगे)
        if (isSpeaking || currentPose === 'WAVE') {
          if (bones.rightArm) bones.rightArm.rotateZ(currentPose === 'WAVE' ? -0.9 : -0.15);
          if (bones.rightForeArm) bones.rightForeArm.rotateZ(Math.sin(el * 7) * 0.15);
        } else {
          if (bones.leftForeArm) bones.leftForeArm.rotateZ(Math.sin(el * 1.7) * 0.03);
          if (bones.rightForeArm) bones.rightForeArm.rotateZ(-Math.sin(el * 1.7 + 1) * 0.03);
        }
        if (currentPose === 'ROAM') {
          const w = el * 6.5;
          if (bones.leftUpLeg) bones.leftUpLeg.rotateX(Math.sin(w) * 0.3);
          if (bones.rightUpLeg) bones.rightUpLeg.rotateX(-Math.sin(w) * 0.3);
          if (bones.leftLeg) bones.leftLeg.rotateX(Math.max(0, Math.cos(w)) * 0.28);
          if (bones.rightLeg) bones.rightLeg.rotateX(Math.max(0, -Math.cos(w)) * 0.28);
        } else if (currentPose === 'CHAIR' || currentPose === 'BENCH') {
          if (bones.leftUpLeg) bones.leftUpLeg.rotateX(-1.15);
          if (bones.rightUpLeg) bones.rightUpLeg.rotateX(-1.15);
          const swing = (currentPose === 'BENCH') ? Math.sin(el * 3.5) * 0.22 : 0;
          if (bones.leftLeg) bones.leftLeg.rotateX(1.15 + swing);
          if (bones.rightLeg) bones.rightLeg.rotateX(1.15 - swing);
        } else if (currentPose === 'BIKE') {
          if (bones.leftUpLeg) { bones.leftUpLeg.rotateX(-1.05); bones.leftUpLeg.rotateZ(0.28); }
          if (bones.rightUpLeg) { bones.rightUpLeg.rotateX(-1.05); bones.rightUpLeg.rotateZ(0.28); }
          if (bones.leftLeg) bones.leftLeg.rotateX(1.2);
          if (bones.rightLeg) bones.rightLeg.rotateX(1.2);
        } else if (currentPose === 'GROUND') {
          if (bones.leftUpLeg) { bones.leftUpLeg.rotateX(-1.35); bones.leftUpLeg.rotateZ(-0.4); }
          if (bones.rightUpLeg) { bones.rightUpLeg.rotateX(-1.35); bones.rightUpLeg.rotateZ(0.4); }
          if (bones.leftLeg) bones.leftLeg.rotateX(1.45);
          if (bones.rightLeg) bones.rightLeg.rotateX(1.45);
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
