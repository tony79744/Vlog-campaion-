<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR AI Vlogging Companion</title>
  <!-- Three.js और GLTFLoader CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #camera-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #three-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      width: max-content;
    }

    .btn {
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid #00ffcc;
      color: #fff;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-record.recording {
      background: #e74c3c;
      border-color: #ff7675;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #status-box {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      border-radius: 12px;
      font-size: 13px;
      z-index: 10;
      backdrop-filter: blur(4px);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- कैमरा वीडियो -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- 3D AR सीन -->
  <canvas id="three-canvas"></canvas>

  <!-- स्टेटस बॉक्स -->
  <div id="status-box">सिस्टम लोड हो रहा है...</div>

  <!-- कंट्रोल बटन -->
  <div class="controls">
    <button class="btn" id="talk-btn" onclick="toggleSpeech()">🎙️ बात करें</button>
    <button class="btn btn-record" id="rec-btn" onclick="toggleRecord()">⏺️ रिकॉर्डिंग</button>
    <button class="btn" onclick="resetCharacterPos()">🔄 सेंटर लाएं</button>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('three-canvas');

    let scene, camera, renderer, model, mixer;
    let clock = new THREE.Clock();
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    // 1. बैकग्राउंड कैमरा
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        statusBox.innerText = "कैमरा सक्रिय। मॉडल आ रहा है...";
      } catch (err) {
        statusBox.innerText = "कैमरा एरर: " + err.message;
      }
    }

    // 2. Three.js AR सीन
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 2.8);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(2, 6, 4);
      scene.add(dirLight);

      // हाई-स्पीड रिलायबल 3D अवतार
      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://threejs.org/examples/models/gltf/Soldier.glb';

      loader.load(modelUrl, (gltf) => {
        model = gltf.scene;
        
        // स्क्रीन के केंद्र में अलाइनमेंट
        model.scale.set(0.9, 0.9, 0.9);
        model.position.set(0, -1.0, 0);
        scene.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const idleAction = mixer.clipAction(gltf.animations[0]); // Idle animation
          idleAction.play();
        }

        statusBox.innerText = "आपकी साथी स्क्रीन पर आ चुकी है! बात करने के लिए 🎙️ दबाएं।";
      }, undefined, (err) => {
        statusBox.innerText = "मॉडल लोड एरर: " + err.message;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (model) {
        model.position.y = -1.0 + Math.sin(Date.now() * 0.003) * 0.015;
      }

      renderer.render(scene, camera);
    }

    function resetCharacterPos() {
      if (model) {
        model.position.set(0, -1.0, 0);
        statusBox.innerText = "कैरेक्टर स्क्रीन के बीच में है।";
      }
    }

    // 3. वॉइस पहचान व बुद्धिमान वार्तालाप (Smart Contextual Replies)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        statusBox.innerText = `आपने पूछा: "${transcript}"`;
        generateSmartReply(transcript);
      };

      recognition.onerror = function(event) {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
        statusBox.innerText = "आवाज़ नहीं सुन पाई (" + event.error + ")। दोबारा बोलें।";
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert("Chrome ब्राउज़र में उपयोग करें।");
        return;
      }

      if (isListening) {
        recognition.stop();
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      } else {
        try {
          recognition.start();
          isListening = true;
          document.getElementById('talk-btn').innerText = "🔴 सुन रही हूँ...";
          statusBox.innerText = "बोलिए, मैं ध्यान से सुन रही हूँ...";
        } catch (e) {
          recognition.stop();
          isListening = false;
        }
      }
    }

    function generateSmartReply(query) {
      statusBox.innerText = "साथी उत्तर तैयार कर रही है...";
      const text = query.toLowerCase();
      let reply = "";

      if (text.includes("कैसी हो") || text.includes("कैसा है") || text.includes("क्या हाल")) {
        reply = "मैं बहुत बढ़िया हूँ! आपके साथ व्लॉग बनाने के लिए बिल्कुल तैयार। आप कैसे हैं?";
      } else if (text.includes("नमस्ते") || text.includes("हेलो") || text.includes("हाय")) {
        reply = "नमस्ते! आज के व्लॉग में हम क्या खास दिखाने वाले हैं?";
      } else if (text.includes("नाम") || text.includes("कौन हो")) {
        reply = "मैं आपकी AI व्लॉगिंग साथी हूँ। आपके वीडियो और सफर में आपका साथ दूंगी।";
      } else if (text.includes("कहाँ") || text.includes("जगह") || text.includes("रास्ता")) {
        reply = "यह लोकेशन बहुत खूबसूरत लग रही है! दर्शकों को यहाँ के बारे में विस्तार से बताइए।";
      } else if (text.includes("मौसम") || text.includes("धूप") || text.includes("बारिश")) {
        reply = "यहाँ का वातावरण बहुत शांत और रिकॉर्डिंग के लिए एकदम सही लग रहा है।";
      } else if (text.includes("दिख नहीं रही") || text.includes("कहाँ हो")) {
        reply = "मैं बिल्कुल आपके सामने स्क्रीन के बीच में खड़ी हूँ! आप कैमरा सीधा रखिए।";
      } else if (text.includes("क्या करें") || text.includes("शुरू")) {
        reply = "चलिए कैमरा घुमाइए और व्लॉग का एक शानदार इंट्रो शूट करते हैं!";
      } else {
        reply = `आपने "${query}" कहा। यह बहुत दिलचस्प है! दर्शकों के साथ इसे और शेयर कीजिए।`;
      }

      setTimeout(() => {
        speakResponse(reply);
      }, 400);
    }

    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      statusBox.innerText = `साथी: "${text}"`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.2;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 4. इन-ऐप स्क्रीन रिकॉर्डर
    async function toggleRecord() {
      const recBtn = document.getElementById('rec-btn');
      if (!isRecording) {
        recordedChunks = [];

        const recordCanvas = document.createElement('canvas');
        recordCanvas.width = 1280;
        recordCanvas.height = 720;
        const ctx = recordCanvas.getContext('2d');

        function drawFrame() {
          if (!isRecording) return;
          ctx.drawImage(video, 0, 0, recordCanvas.width, recordCanvas.height);
          ctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
          requestAnimationFrame(drawFrame);
        }

        isRecording = true;
        drawFrame();

        const canvasStream = recordCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `vlog_companion_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
          }, 100);
          statusBox.innerText = "व्लॉग वीडियो सफलतापूर्वक सेव हो गई!";
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹️ रोकें व सेव करें";
        recBtn.classList.add('recording');
        statusBox.innerText = "रिकॉर्डिंग चालू है...";
      } else {
        isRecording = false;
        mediaRecorder.stop();
        recBtn.innerText = "⏺️ रिकॉर्डिंग";
        recBtn.classList.remove('recording');
      }
    }

    window.addEventListener('load', () => {
      startCamera();
      initThree();
    });

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
