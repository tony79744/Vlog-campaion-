<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Shoulder Octopus Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100dvh; overflow: hidden; background: #0a0e14; font-family: system-ui, sans-serif; }
    #camera-feed { position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; background: #000; }
    #camera-feed.mirror { transform: scaleX(-1); }
    #ar-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 2; pointer-events: none; }
    #overlay-ui { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
    #top-section, #bottom-panel { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
    #top-bar { display: flex; gap: 6px; align-items: center; background: rgba(12,18,28,0.88); padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(0,230,118,0.4); }
    #status-dot { width: 12px; height: 12px; border-radius: 50%; background: #00e676; flex-shrink: 0; box-shadow: 0 0 10px #00e676; }
    #status-dot.listening { background: #ff9100; box-shadow: 0 0 14px #ff9100; }
    #api-key { flex: 1; min-width: 70px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 8px; border-radius: 8px; font-size: 12px; }
    .mini-btn { background: #00e676; color: #000; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
    .mini-btn.secondary { background: #00b0ff; color: #000; }
    #dialogue-box { background: rgba(10,14,22,0.9); color: #00e676; padding: 10px 14px; border-radius: 12px; border-left: 4px solid #00e676; font-size: 14px; line-height: 1.4; }
    #chat-row { display: flex; gap: 6px; background: rgba(12,18,28,0.92); padding: 6px; border-radius: 22px; border: 1px solid rgba(0,230,118,0.45); }
    #text-input { flex: 1; background: transparent; border: none; color: #fff; padding: 6px 12px; font-size: 13px; outline: none; user-select: text; }
    #send-btn { background: #00e676; color: #000; border: none; padding: 6px 14px; border-radius: 16px; font-weight: bold; font-size: 13px; }
    .btn-row { display: flex; gap: 8px; justify-content: space-between; }
    .ctrl-btn { flex: 1; background: rgba(15,22,32,0.92); color: #fff; border: 1.2px solid #00e676; padding: 10px 6px; border-radius: 18px; font-size: 12.5px; font-weight: bold; text-align: center; }
    .ctrl-btn.active { background: #00e676; color: #000; }
  </style>
</head>
<body>
  <video id="camera-feed" autoplay playsinline muted></video>
  <div id="overlay-ui">
    <div id="top-section">
      <div id="top-bar">
        <div id="status-dot"></div>
        <input type="password" id="api-key" placeholder="Gemini API Key डालें">
        <button class="mini-btn" onclick="saveApiKey()">Save</button>
        <button class="mini-btn secondary" onclick="switchCamera()">📷 कैमरा</button>
      </div>
      <div id="dialogue-box">ऑक्टो: "नमस्ते बॉस! मैं आपके कंधे पर बैठा हूँ। बताइए क्या जानना है?"</div>
    </div>
    <div id="bottom-panel">
      <div id="chat-row">
        <input type="text" id="text-input" placeholder="यहाँ लिखकर पूछें..." onkeydown="if(event.key==='Enter') sendTextChat()">
        <button id="send-btn" onclick="sendTextChat()">भेजें</button>
      </div>
      <div class="btn-row">
        <button class="ctrl-btn" id="mic-btn" onclick="toggleVoice()">🎙️ लाइव माइक: OFF</button>
        <button class="ctrl-btn" onclick="switchSide()">🔄 कंधा बदलें</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, clock;
    let octopusGroup, tentacles = [], headMesh;
    let facingMode = 'user', isListening = false, isSpeaking = false, recognition = null;
    let shoulderSide = 1; // 1 = दायां कंधा, -1 = बायां कंधा

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || '';
      initScene(); startCamera(facingMode); initVoice();
    });

    function updateDialogue(t) { document.getElementById('dialogue-box').innerText = 'ऑक्टो: "' + t + '"'; }
    function speakDialogue(t) {
      updateDialogue(t);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = 'hi-IN';
        u.onstart = () => isSpeaking = true;
        u.onend = () => isSpeaking = false;
        window.speechSynthesis.speak(u);
      }
    }
    function saveApiKey() {
      localStorage.setItem('GEMINI_API_KEY', document.getElementById('api-key').value.trim());
      speakDialogue('एपीआई की सेव हो गई है! अब मुझसे कुछ भी पूछिए।');
    }

    async function startCamera(mode) {
      const v = document.getElementById('camera-feed');
      if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; await new Promise(r => setTimeout(r, 250)); }
      for (const c of [{ video: { facingMode: { exact: mode } } }, { video: { facingMode: mode } }, { video: true }]) {
        try { v.srcObject = await navigator.mediaDevices.getUserMedia(c); v.classList.toggle('mirror', mode === 'user'); await v.play(); return; } catch (e) {}
      }
    }
    async function switchCamera() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      await startCamera(facingMode);
      speakDialogue(facingMode === 'user' ? 'फ्रंट कैमरा चालू है!' : 'बैक कैमरा चालू है!');
    }

    function switchSide() {
      shoulderSide *= -1;
      speakDialogue(shoulderSide > 1 ? 'दाएं कंधे पर आ गया!' : 'बाएं कंधे पर आ गया!');
    }

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.domElement.id = 'ar-canvas';
      document.body.appendChild(renderer.domElement);
      clock = new THREE.Clock();

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.5));
      const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(2, 4, 2); scene.add(dl);

      // ऑक्टोपस का ग्रुप (कंधे पर पोजीशन सेट)
      octopusGroup = new THREE.Group();
      scene.add(octopusGroup);

      // ऑक्टोपस का सिर (Glowing Cute Head)
      const headMat = new THREE.MeshStandardMaterial({ color: 0xff3d00, roughness: 0.3, metalness: 0.2 });
      headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), headMat);
      headMesh.scale.set(1, 1.15, 1);
      octopusGroup.add(headMesh);

      // आँखें (Cute Eyes)
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const eyeGeom = new THREE.SphereGeometry(0.03, 16, 16);
      
      const eyeL = new THREE.Mesh(eyeGeom, eyeMat);
      eyeL.position.set(0.07, 0.05, 0.14);
      octopusGroup.add(eyeL);

      const eyeR = new THREE.Mesh(eyeGeom, eyeMat);
      eyeR.position.set(-0.07, 0.05, 0.14);
      octopusGroup.add(eyeR);

      // टेंटेकल्स (Tentacles - जो लहराते रहेंगे)
      const tentMat = new THREE.MeshStandardMaterial({ color: 0xff6e40, roughness: 0.4 });
      for (let i = 0; i < 6; i++) {
        const curve = new THREE.CylinderGeometry(0.02, 0.01, 0.35, 16);
        const tent = new THREE.Mesh(curve, tentMat);
        const angle = (i / 6) * Math.PI * 2;
        tent.position.set(Math.cos(angle) * 0.1, -0.15, Math.sin(angle) * 0.1);
        tent.rotation.z = Math.cos(angle) * 0.4;
        tent.rotation.x = Math.sin(angle) * 0.4;
        octopusGroup.add(tent);
        tentacles.push({ mesh: tent, baseAngle: angle });
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      renderer.setAnimationLoop(renderLoop);
    }

    function initVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      recognition = new SR(); recognition.lang = 'hi-IN'; recognition.continuous = false;
      recognition.onstart = () => document.getElementById('status-dot').classList.add('listening');
      recognition.onresult = (ev) => { const t = ev.results[0][0].transcript.trim(); if (t) handleUserMessage(t); };
      recognition.onend = () => {
        document.getElementById('status-dot').classList.remove('listening');
        if (isListening) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 400);
      };
    }
    function toggleVoice() {
      if (!recognition) return speakDialogue('टाइप करके बात करें।');
      isListening = !isListening;
      const b = document.getElementById('mic-btn');
      b.classList.toggle('active', isListening); b.innerText = isListening ? '🎙️ लाइव माइक: ON' : '🎙️ लाइव माइक: OFF';
      if (isListening) { try { recognition.start(); } catch (e) {} speakDialogue('माइक चालू है, बोलिए!'); }
      else { try { recognition.stop(); } catch (e) {} }
    }
    function sendTextChat() { const inp = document.getElementById('text-input'), t = inp.value.trim(); if (!t) return; inp.value = ''; handleUserMessage(t); }

    async function askGemini(text) {
      const key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) return "कृपया ऊपर API Key डालकर Save दबाएं।";
      for (const m of ['gemini-2.0-flash', 'gemini-1.5-flash']) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: `तुम एक छोटे, प्यारे और ज्ञानी 3D ऑक्टोपस AI हो जो यूजर के कंधे पर बैठा है। यूजर ने पूछा: "${text}". आज की ताज़ा जानकारी, तारीख, या कोई भी सवाल हो, उसका 1-2 छोटे वाक्यों में मजेदार और स्वाभाविक हिंदी में जवाब दो।` }] }] })
          });
          const d = await r.json();
          const txt = d?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (txt) return txt.replace(/[*#]/g, '').trim();
        } catch (e) {}
      }
      return "इंटरनेट या एपीआई की जांच करें।";
    }

    async function handleUserMessage(text) {
      updateDialogue('सुना: "' + text + '"');
      const reply = await askGemini(text);
      speakDialogue(reply);
    }

    function renderLoop() {
      const dt = clock.getDelta(), el = clock.getElapsedTime();
      
      // कंधे पर ऑक्टोपस की नेचुरल पोजीशन (फ्रंट कैमरे में दाएं/बाएं कंधे के पास)
      const targetX = shoulderSide * 0.38;
      const targetY = -0.28 + Math.sin(el * 2.5) * 0.02; // सांस लेने जैसी हल्की ऊपर-नीचे हलचल
      const targetZ = -0.9;

      octopusGroup.position.x = THREE.MathUtils.lerp(octopusGroup.position.x, targetX, dt * 5);
      octopusGroup.position.y = THREE.MathUtils.lerp(octopusGroup.position.y, targetY, dt * 5);
      octopusGroup.position.z = THREE.MathUtils.lerp(octopusGroup.position.z, targetZ, dt * 5);

      // सिर की मस्ती भरी हलचल (Talking / Moving animation)
      headMesh.rotation.z = Math.sin(el * 3) * 0.08;
      headMesh.rotation.y = Math.cos(el * 2) * 0.1;

      // बोलते समय या सामान्य अवस्था में टेंटेकल्स का लहराना
      tentacles.forEach((t, idx) => {
        const speed = isSpeaking ? 8 : 3;
        t.mesh.rotation.x = Math.sin(el * speed + t.baseAngle) * 0.25;
        t.mesh.rotation.z = Math.cos(el * speed + t.baseAngle) * 0.25;
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
