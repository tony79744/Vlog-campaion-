<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR AI Companion - Upgraded</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0a0e14; font-family: system-ui, -apple-system, sans-serif; }
    
    #camera-feed {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }
    #camera-feed.mirror { transform: scaleX(-1); }

    #ar-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: auto;
    }

    #overlay-ui {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 10px;
    }

    #top-section { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }

    #top-bar {
      display: flex; gap: 6px; align-items: center;
      background: rgba(12, 18, 28, 0.88); padding: 7px 10px;
      border-radius: 12px; border: 1px solid rgba(0, 230, 118, 0.4);
      backdrop-filter: blur(6px);
    }

    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #00e676; flex-shrink: 0; box-shadow: 0 0 8px #00e676;
    }
    #status-dot.listening { background: #ff9100; box-shadow: 0 0 10px #ff9100; }

    #api-key {
      flex: 1; min-width: 80px; background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25); color: #fff;
      padding: 6px 8px; border-radius: 8px; font-size: 12px;
    }

    .mini-btn {
      background: #00e676; color: #000; border: none;
      padding: 6px 9px; border-radius: 8px; font-size: 11px;
      font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .mini-btn.secondary { background: #00b0ff; color: #000; }
    .mini-btn.locked { background: #ff1744; color: #fff; }

    #dialogue-box {
      background: rgba(10, 14, 22, 0.88); color: #00e676;
      padding: 10px 14px; border-radius: 12px;
      border-left: 4px solid #00e676; font-size: 13.5px;
      line-height: 1.4; backdrop-filter: blur(4px);
    }

    #distance-bar {
      display: flex; align-items: center; gap: 8px;
      background: rgba(12, 18, 28, 0.82); padding: 6px 12px;
      border-radius: 10px; color: #fff; font-size: 12px;
    }
    #distance-slider { flex: 1; accent-color: #00e676; }

    #bottom-panel {
      pointer-events: auto; display: flex; flex-direction: column; gap: 6px;
    }

    #chat-row {
      display: flex; gap: 6px; background: rgba(12, 18, 28, 0.9);
      padding: 6px; border-radius: 24px; border: 1px solid rgba(0, 230, 118, 0.4);
    }
    #text-input {
      flex: 1; background: transparent; border: none; color: #fff;
      padding: 6px 10px; font-size: 13px; outline: none; user-select: text;
    }
    #send-btn {
      background: #00e676; color: #000; border: none;
      padding: 6px 14px; border-radius: 18px; font-weight: bold; font-size: 12px;
    }

    .btn-row { display: flex; gap: 5px; justify-content: space-between; }
    .ctrl-btn {
      flex: 1; background: rgba(15, 22, 32, 0.9); color: #fff;
      border: 1.2px solid #00e676; padding: 9px 4px;
      border-radius: 18px; font-size: 11.5px; font-weight: bold;
      text-align: center; cursor: pointer;
    }
    .ctrl-btn.active { background: #00e676; color: #000; }
    .ctrl-btn.danger { background: #ff1744; border-color: #ff1744; color: #fff; }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <div id="overlay-ui">
    <div id="top-section">
      <div id="top-bar">
        <div id="status-dot"></div>
        <input type="password" id="api-key" placeholder="Gemini API Key यहाँ डालें">
        <button class="mini-btn" onclick="saveApiKey(event)">Save</button>
        <button class="mini-btn secondary" id="cam-btn" onclick="switchCamera(event)">📷 फ्रंट/बैक</button>
        <button class="mini-btn" id="stranger-btn" onclick="toggleStrangerLock(event)">🔓 Owner</button>
      </div>

      <div id="dialogue-box">आर्या: "नमस्ते! मैं लोड हो रही हूँ और आपके बिल्कुल सामने खड़ी हो रही हूँ..."</div>

      <div id="distance-bar">
        <span>📏 दूरी (Pass/Door):</span>
        <input type="range" id="distance-slider" min="1.2" max="4.2" step="0.1" value="2.2" oninput="onDistanceSlider(this.value)">
        <span id="dist-val">2.2m</span>
      </div>
    </div>

    <div id="bottom-panel">
      <div id="chat-row">
        <input type="text" id="text-input" placeholder="यहाँ लिखकर या माइक से बोलकर बात करें..." onkeydown="if(event.key==='Enter') sendTextChat()">
        <button id="send-btn" onclick="sendTextChat()">भेजें</button>
      </div>

      <div class="btn-row">
        <button class="ctrl-btn" id="couple-btn" onclick="toggleCoupleMode(event)">💑 कपल मोड</button>
        <button class="ctrl-btn" id="sit-btn" onclick="toggleSit(event)">🪑 बैठो / उठो</button>
        <button class="ctrl-btn" id="roam-btn" onclick="toggleRoam(event)">🚶 खुद घूमो</button>
        <button class="ctrl-btn" id="dance-btn" onclick="toggleDance(event)">💃 डांस</button>
      </div>

      <div class="btn-row">
        <button class="ctrl-btn" id="mic-btn" onclick="toggleContinuousVoice(event)">🎙️ माइक: OFF</button>
        <button class="ctrl-btn" onclick="triggerProactiveVision(event)">👁️ सामने देखो</button>
        <button class="ctrl-btn" onclick="recenterCharacter(event)">🔄 सेंटर लाएं</button>
        <button class="ctrl-btn" id="rec-btn" onclick="toggleRecording(event)">⏺️ रिकॉर्ड</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const FEMALE_MODEL_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Michelle.glb';
    const ANIM_SOURCE_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb';

    let scene, camera, renderer, clock, mixer, character, floorGroup, greenRing, redRing, groundPlane, stoolMesh;
    let bones = {};
    let actions = { idle: null, walk: null, run: null, dance: null };
    let currentAction = null;

    let isWalking = false, isRoaming = false, isSitting = false, isDancing = false, isCoupleMode = false;
    let strangerLock = false, roamTimer = 0, sitProgress = 0;
    let facingMode = 'environment'; // 'environment' or 'user'
    let targetPosition = new THREE.Vector3(0, 0, -2.2);

    let deviceAlpha = 0, deviceBeta = 80, initialAlpha = null, gyroEnabled = false;
    let recognition = null, isListening = false;
    let mediaRecorder = null, recordedChunks = [], isRecording = false;
    let chatHistory = [];
    const raycaster = new THREE.Raycaster();

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || '';
      initScene();
      startCamera(facingMode);
      setupGyroscope();
      initVoiceRecognition();
    });

    function updateDialogue(t) {
      document.getElementById('dialogue-box').innerText = 'आर्या: "' + t + '"';
    }

    function speakDialogue(t) {
      updateDialogue(t);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'hi-IN';
        u.rate = 1.02;
        window.speechSynthesis.speak(u);
      }
    }

    function saveApiKey(e) {
      if (e) e.stopPropagation();
      const val = document.getElementById('api-key').value.trim();
      localStorage.setItem('GEMINI_API_KEY', val);
      speakDialogue('आपकी जेमिनी एपीआई की सेव हो गई है! अब आप मुझसे सीधे बात कर सकते हैं।');
    }

    function toggleStrangerLock(e) {
      if (e) e.stopPropagation();
      strangerLock = !strangerLock;
      const b = document.getElementById('stranger-btn');
      b.innerText = strangerLock ? '🔒 Stranger' : '🔓 Owner';
      b.classList.toggle('locked', strangerLock);
      speakDialogue(strangerLock ? 'स्ट्रेंजर लॉक चालू हो गया है।' : 'ओनर मोड चालू है!');
    }

    async function startCamera(mode) {
      const v = document.getElementById('camera-feed');
      if (v.srcObject) {
        v.srcObject.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: mode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        v.srcObject = stream;
        v.classList.toggle('mirror', mode === 'user');
        await v.play();
      } catch (err) {
        try {
          const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          v.srcObject = fallback;
          await v.play();
        } catch (err2) {
          updateDialogue('कैमरा चालू नहीं हो पाया। कृपया ब्राउज़र में Camera Permission Allow करें और HTTPS/GitHub Pages पर खोलें।');
        }
      }
    }

    function switchCamera(e) {
      if (e) e.stopPropagation();
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      startCamera(facingMode);
      speakDialogue(facingMode === 'user' ? 'फ्रंट सेल्फी कैमरा चालू हो गया है! कपल मोड के लिए यह बेस्ट है।' : 'बैक कैमरा चालू हो गया है।');
    }

    function setupGyroscope() {
      window.addEventListener('deviceorientation', (ev) => {
        if (ev.beta !== null) {
          gyroEnabled = true;
          if (initialAlpha === null && ev.alpha !== null) initialAlpha = ev.alpha;
          deviceAlpha = ev.alpha !== null ? ev.alpha - (initialAlpha || 0) : 0;
          deviceBeta = ev.beta;
        }
      }, true);
    }

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 50);
      camera.position.set(0, 1.35, 0);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.domElement.id = 'ar-canvas';
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 1.25);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(2, 5, 3);
      dirLight.castShadow = true;
      scene.add(dirLight);

      groundPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.ShadowMaterial({ opacity: 0.35 })
      );
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.y = 0;
      groundPlane.receiveShadow = true;
      scene.add(groundPlane);

      // Character Floor Anchor Group (Centered by default!)
      floorGroup = new THREE.Group();
      floorGroup.position.set(0, 0, -2.2);
      scene.add(floorGroup);

      greenRing = new THREE.Mesh(
        new THREE.RingGeometry(0.38, 0.45, 36).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00e676, side: THREE.DoubleSide, transparent: true, opacity: 0.65 })
      );
      greenRing.position.y = 0.01;
      floorGroup.add(greenRing);

      redRing = new THREE.Mesh(
        new THREE.RingGeometry(0.18, 0.38, 36).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xff1744, side: THREE.DoubleSide, transparent: true, opacity: 0 })
      );
      redRing.position.y = 0.015;
      floorGroup.add(redRing);

      // Holographic Stool for Real Sitting Pose
      stoolMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.2, 0.46, 24),
        new THREE.MeshStandardMaterial({ color: 0x00b0ff, transparent: true, opacity: 0.55, roughness: 0.3 })
      );
      stoolMesh.position.set(0, 0.23, -0.08);
      stoolMesh.visible = false;
      floorGroup.add(stoolMesh);

      loadCharacterAndAnimations();

      renderer.domElement.addEventListener('pointerdown', onScreenTap);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      renderer.setAnimationLoop(renderLoop);
    }

    function loadCharacterAndAnimations() {
      const loader = new THREE.GLTFLoader();

      // 1. Load Real Female Character (Michelle.glb)
      loader.load(FEMALE_MODEL_URL, (gltf) => {
        character = gltf.scene;
        character.scale.set(1.0, 1.0, 1.0);
        character.position.set(0, 0, 0);

        character.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
          if (obj.isBone) {
            const n = obj.name;
            if (n.includes('Hips')) bones.hips = obj;
            if (n.includes('Spine1')) bones.spine1 = obj;
            if (n.includes('Spine2')) bones.spine2 = obj;
            if (n.includes('Neck')) bones.neck = obj;
            if (n.includes('Head')) bones.head = obj;
            if (n.includes('LeftUpLeg')) bones.leftUpLeg = obj;
            if (n.includes('RightUpLeg')) bones.rightUpLeg = obj;
            if (n.includes('LeftLeg')) bones.leftLeg = obj;
            if (n.includes('RightLeg')) bones.rightLeg = obj;
            if (n.includes('LeftArm')) bones.leftArm = obj;
            if (n.includes('RightArm')) bones.rightArm = obj;
            if (n.includes('LeftForeArm')) bones.leftForeArm = obj;
            if (n.includes('RightForeArm')) bones.rightForeArm = obj;
          }
        });

        floorGroup.add(character);
        mixer = new THREE.AnimationMixer(character);

        // Save Michelle's built-in Samba clip ONLY for Dance button
        if (gltf.animations && gltf.animations.length > 0) {
          actions.dance = mixer.clipAction(gltf.animations[0]);
        }

        // 2. Load Natural Idle & Walk Animations from Mixamo Xbot & Retarget
        loader.load(ANIM_SOURCE_URL, (animGltf) => {
          animGltf.animations.forEach((clip) => {
            const name = clip.name.toLowerCase();
            // Remove position tracks so Michelle's height/hips stay locked to the ground
            const filteredTracks = clip.tracks.filter(t => !t.name.endsWith('.position'));
            const cleanClip = new THREE.AnimationClip(clip.name, clip.duration, filteredTracks);

            if (name === 'idle') actions.idle = mixer.clipAction(cleanClip);
            if (name === 'walk') actions.walk = mixer.clipAction(cleanClip);
            if (name === 'run') actions.run = mixer.clipAction(cleanClip);
          });

          playAnimation('idle');
          lookAtCameraFlat();
          speakDialogue('नमस्ते! मैं आर्या हूँ। मैं आपके सामने खड़ी हूँ। आप मुझसे बोलकर या नीचे लिखकर बात कर सकते हैं!');
        });
      });
    }

    function playAnimation(name) {
      const nextAction = actions[name];
      if (!nextAction) return;
      if (currentAction !== nextAction) {
        if (currentAction) currentAction.fadeOut(0.25);
        nextAction.reset().fadeIn(0.25).play();
        currentAction = nextAction;
      }
    }

    function lookAtCameraFlat() {
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      floorGroup.lookAt(camPos.x, floorGroup.position.y, camPos.z);
    }

    function onScreenTap(e) {
      if (e.target !== renderer.domElement) return;
      const mouse = new THREE.Vector2(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(groundPlane);
      if (hits.length > 0) {
        const pt = hits[0].point;
        if (pt.distanceTo(camera.position) < 8) {
          isSitting = false;
          isDancing = false;
          stoolMesh.visible = false;
          document.getElementById('sit-btn').classList.remove('active');
          document.getElementById('dance-btn').classList.remove('active');

          targetPosition.set(pt.x, 0, pt.z);
          isWalking = true;
          playAnimation('walk');
        }
      }
    }

    // Distance / Depth Matching (Move closer or further on the ground)
    function onDistanceSlider(val) {
      const dist = parseFloat(val);
      document.getElementById('dist-val').innerText = dist.toFixed(1) + 'm';
      const xOffset = isCoupleMode ? 0.42 : 0;
      targetPosition.set(xOffset, 0, -dist);

      if (Math.abs(floorGroup.position.z - targetPosition.z) > 0.12 && !isSitting) {
        isWalking = true;
        playAnimation('walk');
      }
      // Personal space warning if closer than 1.3m
      redRing.material.opacity = dist <= 1.3 ? 0.8 : 0;
    }

    // Feature 2: Couple Mode (Stand right beside the user)
    function toggleCoupleMode(e) {
      if (e) e.stopPropagation();
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है!');

      isCoupleMode = !isCoupleMode;
      isRoaming = false;
      isSitting = false;
      isDancing = false;
      stoolMesh.visible = false;

      document.getElementById('couple-btn').classList.toggle('active', isCoupleMode);
      document.getElementById('roam-btn').classList.remove('active');
      document.getElementById('sit-btn').classList.remove('active');
      document.getElementById('dance-btn').classList.remove('active');

      const dist = parseFloat(document.getElementById('distance-slider').value);
      if (isCoupleMode) {
        // Walk next to user (side-by-side in frame)
        targetPosition.set(0.42, 0, -Math.min(dist, 1.9));
        isWalking = true;
        playAnimation('walk');
        speakDialogue('मैं आपके पास आकर आपके बगल में खड़ी हो रही हूँ!');
      } else {
        targetPosition.set(0, 0, -dist);
        isWalking = true;
        playAnimation('walk');
        speakDialogue('मैं वापस आपके सामने सेंटर में आ रही हूँ।');
      }
    }

    // Feature 5: Real Bone-Based Sitting (No scale.y squashing!)
    function toggleSit(e) {
      if (e) e.stopPropagation();
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है!');

      isSitting = !isSitting;
      isRoaming = false;
      isWalking = false;
      isDancing = false;

      document.getElementById('sit-btn').classList.toggle('active', isSitting);
      document.getElementById('roam-btn').classList.remove('active');
      document.getElementById('dance-btn').classList.remove('active');

      stoolMesh.visible = isSitting;
      playAnimation('idle');
      lookAtCameraFlat();
      speakDialogue(isSitting ? 'मैं स्टूल पर आराम से बैठ गई हूँ।' : 'मैं वापस खड़ी हो गई हूँ!');
    }

    function toggleRoam(e) {
      if (e) e.stopPropagation();
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है!');

      isRoaming = !isRoaming;
      isSitting = false;
      isDancing = false;
      isCoupleMode = false;
      stoolMesh.visible = false;

      document.getElementById('roam-btn').classList.toggle('active', isRoaming);
      document.getElementById('sit-btn').classList.remove('active');
      document.getElementById('dance-btn').classList.remove('active');
      document.getElementById('couple-btn').classList.remove('active');

      if (isRoaming) {
        pickNewRoamTarget();
        speakDialogue('मैं आस-पास ज़मीन पर टहल रही हूँ!');
      } else {
        isWalking = false;
        playAnimation('idle');
        lookAtCameraFlat();
        speakDialogue('मैं रुक गई हूँ।');
      }
    }

    function pickNewRoamTarget() {
         const angle = (Math.random() - 0.5) * Math.PI * 0.9;
      const dist = 1.6 + Math.random() * 1.4;
      targetPosition.set(Math.sin(angle) * 0.9, 0, -dist);
      isWalking = true;
      playAnimation('walk');
    }

    function toggleDance(e) {
      if (e) e.stopPropagation();
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है!');
      isDancing = !isDancing; isSitting = false; isRoaming = false; isWalking = false;
      stoolMesh.visible = false;
      document.getElementById('dance-btn').classList.toggle('active', isDancing);
      document.getElementById('sit-btn').classList.remove('active');
      document.getElementById('roam-btn').classList.remove('active');
      if (isDancing) { playAnimation('dance'); speakDialogue('चलिए थोड़ा डांस करते हैं!'); }
      else { playAnimation('idle'); speakDialogue('डांस बंद, अब बताइए क्या करना है?'); }
    }

    function recenterCharacter(e) {
      if (e) e.stopPropagation();
      initialAlpha = null; isSitting = false; isDancing = false; isRoaming = false; isCoupleMode = false; isWalking = false;
      stoolMesh.visible = false;
      document.querySelectorAll('.ctrl-btn').forEach(b => {
        if (b.id !== 'mic-btn' && b.id !== 'rec-btn') b.classList.remove('active');
      });
      const dist = 2.2;
      document.getElementById('distance-slider').value = dist;
      document.getElementById('dist-val').innerText = '2.2m';
      floorGroup.position.set(0, 0, -dist);
      targetPosition.copy(floorGroup.position);
      playAnimation('idle'); lookAtCameraFlat();
      speakDialogue('मैं वापस आपके बिल्कुल सामने सेंटर में आ गई हूँ!');
    }

    function initVoiceRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      recognition = new SR();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onstart = () => document.getElementById('status-dot').classList.add('listening');
      recognition.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript.trim();
        if (transcript) handleUserMessage(transcript);
      };
      recognition.onend = () => {
        document.getElementById('status-dot').classList.remove('listening');
        if (isListening) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 400);
      };
    }

    function toggleContinuousVoice(e) {
      if (e) e.stopPropagation();
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है!');
      if (!recognition) return speakDialogue('वॉइस सपोर्ट नहीं है, नीचे चैट बॉक्स में लिखें।');
      isListening = !isListening;
      const btn = document.getElementById('mic-btn');
      btn.classList.toggle('active', isListening);
      btn.innerText = isListening ? '🎙️ माइक: ON' : '🎙️ माइक: OFF';
      if (isListening) {
        try { recognition.start(); } catch (err) {}
        speakDialogue('माइक चालू है! अब आप सीधे बोल सकते हैं।');
      } else {
        try { recognition.stop(); } catch (err) {}
        updateDialogue('माइक बंद कर दिया गया है।');
      }
    }

    function sendTextChat() {
      const inp = document.getElementById('text-input');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      handleUserMessage(txt);
    }

    async function handleUserMessage(text) {
      if (strangerLock) return speakDialogue('स्ट्रेंजर लॉक चालू है।');
      updateDialogue('आपने कहा: "' + text + '"');
      const lower = text.toLowerCase();

      if (lower.includes('बैठ') || lower.includes('sit')) { if (!isSitting) toggleSit(); return; }
      if (lower.includes('उठ') || lower.includes('खड़ी हो') || lower.includes('stand')) { if (isSitting) toggleSit(); return; }
      if (lower.includes('डांस') || lower.includes('नाच') || lower.includes('dance')) { if (!isDancing) toggleDance(); return; }
      if (lower.includes('रुक') || lower.includes('बस करो') || lower.includes('stop')) {
        isDancing = false; isRoaming = false; isWalking = false;
        document.getElementById('dance-btn').classList.remove('active');
        document.getElementById('roam-btn').classList.remove('active');
        playAnimation('idle'); speakDialogue('ठीक है, मैं रुक गई हूँ।'); return;
      }
      if (lower.includes('मेरे पास') || lower.includes('बगल में') || lower.includes('कपल') || lower.includes('पास आओ')) {
        isCoupleMode = false; toggleCoupleMode(); return;
      }
      if (lower.includes('दूर जाओ') || lower.includes('पीछे हटो')) {
        document.getElementById('distance-slider').value = 3.4; onDistanceSlider(3.4);
        speakDialogue('ठीक है, मैं थोड़ा पीछे हट रही हूँ।'); return;
      }
      if (lower.includes('सामने देखो') || lower.includes('क्या दिख रहा')) { triggerProactiveVision(); return; }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) return speakDialogue('सवाल-जवाब के लिए ऊपर अपनी Gemini API Key डालकर Save दबाएं!');

      chatHistory.push({ role: 'user', parts: [{ text: text }] });
      if (chatHistory.length > 10) chatHistory.shift();

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: 'तुम "आर्या" हो, एक जीवंत और दोस्ताना 3D AR AI साथी। यूजर के सवालों का जवाब रटी-रटाई लाइनों में नहीं, बल्कि एक असली दोस्त की तरह स्वाभाविक हिंदी में 1 से 3 छोटे वाक्यों में दो।' }] },
            contents: chatHistory
          })
        });
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          const clean = reply.replace(/[*#]/g, '').trim();
          chatHistory.push({ role: 'model', parts: [{ text: clean }] });
          speakDialogue(clean);
        } else speakDialogue('मुझे आपकी बात समझ आई, थोड़ा और बताइए!');
      } catch (err) { speakDialogue('इंटरनेट या API कनेक्शन में थोड़ी दिक्कत है।'); }
    }

    async function triggerProactiveVision(e) {
      if (e) e.stopPropagation();
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) return speakDialogue('पहले ऊपर Gemini API Key डालकर Save करें।');
      const v = document.getElementById('camera-feed'), c = document.getElementById('capture-canvas');
      c.width = 480; c.height = 360; c.getContext('2d').drawImage(v, 0, 0, 480, 360);
      const b64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];
      updateDialogue('आर्या सामने का नज़ारा देख रही है...');
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: 'तुम आर्या हो। इस लाइव कैमरा फ्रेम में क्या दिख रहा है, उस पर 1-2 छोटे वाक्यों में दोस्त की तरह हिंदी में टिप्पणी करो।' }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }] })
        });
        const data = await res.json();
        speakDialogue((data?.candidates?.[0]?.content?.parts?.[0]?.text || 'नज़ारा बहुत बढ़िया है!').replace(/[*#]/g, '').trim());
      } catch (err) { speakDialogue('कैमरे की तस्वीर पढ़ने में थोड़ा समय लग रहा है।'); }
    }

    function toggleRecording(e) {
      if (e) e.stopPropagation();
      const b = document.getElementById('rec-btn');
      if (!isRecording) {
        try {
          mediaRecorder = new MediaRecorder(renderer.domElement.captureStream(30));
          recordedChunks = [];
          mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
          mediaRecorder.onstop = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
            a.download = 'arya-ar-vlog.webm'; a.click();
          };
          mediaRecorder.start(); isRecording = true; b.classList.add('danger'); b.innerText = '⏹️ स्टॉप';
          speakDialogue('वीडियो रिकॉर्डिंग शुरू!');
        } catch (err) { speakDialogue('रिकॉर्डिंग उपलब्ध नहीं है।'); }
      } else {
        mediaRecorder.stop(); isRecording = false; b.classList.remove('danger'); b.innerText = '⏺️ रिकॉर्ड';
        speakDialogue('वीडियो सेव हो गई!');
      }
    }

    function renderLoop() {
      const dt = clock.getDelta(), elapsed = clock.getElapsedTime();
      if (mixer) mixer.update(dt);

      if (gyroEnabled) {
        camera.rotation.order = 'YXZ';
        camera.rotation.x = THREE.MathUtils.clamp(THREE.MathUtils.degToRad(deviceBeta - 85), -0.35, 0.35);
        camera.rotation.y = THREE.MathUtils.clamp(THREE.MathUtils.degToRad(deviceAlpha * 0.3), -0.4, 0.4);
      }

      if (isWalking && character) {
        if (floorGroup.position.distanceTo(targetPosition) > 0.06) {
          const dir = new THREE.Vector3().subVectors(targetPosition, floorGroup.position).normalize();
          floorGroup.position.addScaledVector(dir, dt * 1.05);
          floorGroup.position.y = 0;
          floorGroup.lookAt(targetPosition.x, 0, targetPosition.z);
        } else {
          floorGroup.position.copy(targetPosition); floorGroup.position.y = 0;
          isWalking = false; playAnimation('idle'); lookAtCameraFlat();
          if (isRoaming) roamTimer = 2.8;
        }
      } else if (isRoaming && !isWalking) {
        roamTimer -= dt; if (roamTimer <= 0) pickNewRoamTarget();
      }

      if (character && bones.spine1) {
        const breath = Math.sin(elapsed * 2.4) * 0.035;
        bones.spine1.rotation.x += breath;
        if (bones.spine2) bones.spine2.rotation.x += breath * 0.7;
        if (bones.head && !isDancing) {
          bones.head.rotation.y += Math.sin(elapsed * 0.9) * 0.08;
          bones.head.rotation.z += Math.cos(elapsed * 0.7) * 0.03;
        }
        const targetSit = isSitting ? 1 : 0;
        sitProgress = THREE.MathUtils.lerp(sitProgress, targetSit, dt * 6);
        if (sitProgress > 0.01) {
          character.position.y = -0.38 * sitProgress;
          if (bones.leftUpLeg) bones.leftUpLeg.rotation.x -= 1.35 * sitProgress;
          if (bones.rightUpLeg) bones.rightUpLeg.rotation.x -= 1.35 * sitProgress;
          if (bones.leftLeg) bones.leftLeg.rotation.x += 1.45 * sitProgress;
          if (bones.rightLeg) bones.rightLeg.rotation.x += 1.45 * sitProgress;
          if (bones.spine1) bones.spine1.rotation.x += 0.15 * sitProgress;
        } else {
          character.position.y = 0;
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
