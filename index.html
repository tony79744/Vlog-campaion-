<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR AI Vlogging Companion</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #camera-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #three-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      width: max-content;
    }

    .btn {
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid #00ffcc;
      color: #fff;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-record.recording {
      background: #e74c3c;
      border-color: #ff7675;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #status-box {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      border-radius: 14px;
      font-size: 14px;
      z-index: 10;
      backdrop-filter: blur(4px);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- कैमरा वीडियो -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- 3D AR सीन -->
  <canvas id="three-canvas"></canvas>

  <!-- स्थिति बॉक्स -->
  <div id="status-box">सिस्टम शुरू हो रहा है...</div>

  <!-- कंट्रोल बटन -->
  <div class="controls">
    <button class="btn" id="talk-btn" onclick="toggleSpeech()">🎙️ बात करें</button>
    <button class="btn btn-record" id="rec-btn" onclick="toggleRecord()">⏺️ रिकॉर्डिंग</button>
    <button class="btn" onclick="resetCharacterPos()">🔄 सेंटर लाएं</button>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('three-canvas');

    let scene, camera, renderer, model, mixer;
    let clock = new THREE.Clock();
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    // 1. कैमरा
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        statusBox.innerText = "कैमरा सक्रिय। मॉडल लोड हो रहा है...";
      } catch (err) {
        statusBox.innerText = "कैमरा एरर: " + err.message;
      }
    }

    // 2. Three.js AR सीन (बिल्कुल बीचों-बीच सेंटर व्यू)
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 2.5); // कैमरे को सीधा सामने रखा

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.8);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(0, 4, 3);
      scene.add(dirLight);

      // सुंदर फ़ीमेल (गर्ल) 3D मॉडल
      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb';

      loader.load(modelUrl, (gltf) => {
        model = gltf.scene;
        
        // स्क्रीन के बिल्कुल बीच (Center) में अलाइनमेंट
        model.scale.set(0.65, 0.65, 0.65);
        model.position.set(0, -0.65, 0);
        scene.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const idleAction = mixer.clipAction(gltf.animations[0]);
          idleAction.play();
        }

        statusBox.innerText = "नमस्ते! मैं स्क्रीन पर तैयार हूँ। बात करने के लिए 🎙️ दबाएं।";
      }, undefined, (err) => {
        statusBox.innerText = "मॉडल लोड एरर: " + err.message;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (model) {
        model.position.y = -0.65 + Math.sin(Date.now() * 0.003) * 0.015;
      }

      renderer.render(scene, camera);
    }

    function resetCharacterPos() {
      if (model) {
        model.position.set(0, -0.65, 0);
        statusBox.innerText = "कैरेक्टर स्क्रीन के बिल्कुल बीच में सेट हो गया।";
      }
    }

    // 3. वॉइस पहचान व सटीक उत्तर (Real Smart Engine)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        statusBox.innerText = `आपने पूछा: "${transcript}"`;
        generateAnswer(transcript);
      };

      recognition.onerror = function(event) {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
        statusBox.innerText = "आवाज़ समझ नहीं आई (" + event.error + ")। दोबारा बोलें।";
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert("Chrome ब्राउज़र में उपयोग करें।");
        return;
      }

      if (isListening) {
        recognition.stop();
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      } else {
        try {
          recognition.start();
          isListening = true;
          document.getElementById('talk-btn').innerText = "🔴 सुन रही हूँ...";
          statusBox.innerText = "बोलिए, मैं सुन रही हूँ...";
        } catch (e) {
          recognition.stop();
          isListening = false;
        }
      }
    }

    // वास्तविक और सटीक जवाब देने वाला फ़ंक्शन
    function generateAnswer(query) {
      statusBox.innerText = "जवाब तैयार कर रही हूँ...";
      const text = query.toLowerCase();
      let reply = "";

      const now = new Date();

      // तारीख (Date) का सवाल
      if (text.includes("तारीख") || text.includes("तारीख क्या") || text.includes("डेट") || text.includes("date")) {
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        const dateStr = now.toLocaleDateString('hi-IN', options);
        reply = `आज की तारीख ${dateStr} है।`;
      } 
      // समय (Time) का सवाल
      else if (text.includes("समय") || text.includes("टाइम") || text.includes("कितने बजे") || text.includes("time")) {
        const timeStr = now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
        reply = `अभी समय ${timeStr} हो रहा है।`;
      }
      // हाल-चाल
      else if (text.includes("कैसी हो") || text.includes("कैसा") || text.includes("हाल")) {
        reply = "मैं बहुत अच्छी हूँ और आपके साथ व्लॉगिंग करने के लिए बहुत उत्साहित हूँ! आप कैसे हैं?";
      }
      // अभिवादन
      else if (text.includes("नमस्ते") || text.includes("हेलो") || text.includes("हाय")) {
        reply = "नमस्ते! आज के सफर में हम क्या नया देखने वाले हैं?";
      }
      // परिचय
      else if (text.includes("नाम") || text.includes("कौन हो")) {
        reply = "मैं आपकी AI व्लॉगिंग साथी हूँ। मैं आपके हर सफर में आपके साथ रहूँगी।";
      }
      // जगह या व्लॉगिंग
      else if (text.includes("जगह") || text.includes("कहाँ") || text.includes("लोकेशन")) {
        reply = "यह जगह वीडियो के लिए बहुत अच्छी लग रही है, चलिए आगे चलकर दर्शकों को और दिखाते हैं!";
      }
      // सामान्य सवाल
      else {
        reply = "हाँ, मैंने आपकी बात सुन ली। आप कैमरे में दर्शकों से बात जारी रखिए, मैं आपके साथ हूँ!";
      }

      setTimeout(() => {
        speakResponse(reply);
      }, 300);
    }

    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      statusBox.innerText = `साथी: "${text}"`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.3; // मधुर महिला आवाज़
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 4. स्क्रीन रिकॉर्डर
    async function toggleRecord() {
      const recBtn = document.getElementById('rec-btn');
      if (!isRecording) {
        recordedChunks = [];

        const recordCanvas = document.createElement('canvas');
        recordCanvas.width = 1280;
        recordCanvas.height = 720;
        const ctx = recordCanvas.getContext('2d');

        function drawFrame() {
          if (!isRecording) return;
          ctx.drawImage(video, 0, 0, recordCanvas.width, recordCanvas.height);
          ctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
          requestAnimationFrame(drawFrame);
        }

        isRecording = true;
        drawFrame();

        const canvasStream = recordCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `vlog_companion_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
          }, 100);
          statusBox.innerText = "व्लॉग वीडियो सेव हो गई है!";
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹️ रोकें व सेव करें";
        recBtn.classList.add('recording');
        statusBox.innerText = "रिकॉर्डिंग चालू है...";
      } else {
        isRecording = false;
        mediaRecorder.stop();
        recBtn.innerText = "⏺️ रिकॉर्डिंग";
        recBtn.classList.remove('recording');
      }
    }

    window.addEventListener('load', () => {
      startCamera();
      initThree();
    });

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
