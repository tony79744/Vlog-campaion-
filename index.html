<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR AI Vlogging Companion</title>
  <!-- Three.js और GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #camera-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #three-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      width: max-content;
    }

    .btn {
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid #00ffcc;
      color: #fff;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-record.recording {
      background: #e74c3c;
      border-color: #ff7675;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #status-box {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ffcc;
      border-radius: 12px;
      font-size: 13px;
      z-index: 10;
      backdrop-filter: blur(4px);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- कैमरा वीडियो -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- 3D AR सीन -->
  <canvas id="three-canvas"></canvas>

  <!-- स्थिति और सबटाइटल -->
  <div id="status-box">स्थिति: कैमरा और सिस्टम शुरू हो रहा है...</div>

  <!-- कंट्रोल बटन -->
  <div class="controls">
    <button class="btn" id="talk-btn" onclick="toggleSpeech()">🎙️ बात करें</button>
    <button class="btn btn-record" id="rec-btn" onclick="toggleRecord()">⏺️ रिकॉर्डिंग</button>
    <button class="btn" onclick="resetCharacterPos()">🔄 सेंटर लाएं</button>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('three-canvas');

    let scene, camera, renderer, model;
    let clock = new THREE.Clock();
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    // 1. कैमरा
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        statusBox.innerText = "कैमरा चालू है। गर्ल कैरेक्टर लोड हो रहा है...";
      } catch (err) {
        statusBox.innerText = "कैमरा एरर: " + err.message;
      }
    }

    // 2. Three.js AR सीन
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0.4, 2.0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x555555, 1.4);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(0, 4, 3);
      scene.add(dirLight);

      // हाई क्वालिटी फीमेल (Girl) 3D मॉडल
      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://models.readyplayer.me/661feb3563b4a87a148eb0df.glb';

      loader.load(modelUrl, (gltf) => {
        model = gltf.scene;
        
        // स्क्रीन के बिल्कुल बीच (X = 0) में सेट
        model.scale.set(1.0, 1.0, 1.0);
        model.position.set(0, -0.9, 0);
        scene.add(model);

        statusBox.innerText = "आपकी साथी तैयार है! बात करने के लिए 🎙️ दबाएं।";
      }, undefined, (err) => {
        statusBox.innerText = "मॉडल लोड करने में समस्या: " + err.message;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      // हल्का सांस लेने का रियल मोशन
      if (model) {
        model.position.y = -0.9 + Math.sin(Date.now() * 0.003) * 0.015;
      }

      renderer.render(scene, camera);
    }

    function resetCharacterPos() {
      if (model) {
        model.position.set(0, -0.9, 0);
        statusBox.innerText = "कैरेक्टर स्क्रीन के बीच में आ गया।";
      }
    }

    // 3. वॉइस इंटरैक्शन
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        statusBox.innerText = `आपने कहा: "${transcript}"`;
        botReply(transcript);
      };

      recognition.onerror = function(event) {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
        statusBox.innerText = "माइक एरर (" + event.error + ") - दोबारा टैप करें।";
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert("Chrome ब्राउज़र का उपयोग करें।");
        return;
      }

      if (isListening) {
        recognition.stop();
        isListening = false;
        document.getElementById('talk-btn').innerText = "🎙️ बात करें";
      } else {
        try {
          recognition.start();
          isListening = true;
          document.getElementById('talk-btn').innerText = "🔴 सुन रही हूँ...";
          statusBox.innerText = "बोलिए, मैं सुन रही हूँ...";
        } catch (e) {
          recognition.stop();
          isListening = false;
        }
      }
    }

    function botReply(userText) {
      statusBox.innerText = "साथी सोच रही है...";
      
      let reply = "हाँ, सब कुछ बहुत बढ़िया दिख रहा है! आगे क्या करने वाले हैं?";
      if (userText.includes("कैसी हो") || userText.includes("कैसा")) {
        reply = "मैं बहुत अच्छी हूँ! आज के व्लॉग में हम क्या नया देखने वाले हैं?";
      } else if (userText.includes("नमस्ते") || userText.includes("हेलो")) {
        reply = "नमस्ते! आज आपके साथ व्लॉगिंग करके बहुत मज़ा आने वाला है।";
      } else if (userText.includes("कहाँ") || userText.includes("रास्ता")) {
        reply = "हम बिल्कुल सही जगह पर हैं, आगे बढ़ते रहिए।";
      }

      setTimeout(() => {
        speakResponse(reply);
      }, 500);
    }

    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      statusBox.innerText = `साथी: "${text}"`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.25; // प्यारी लड़की की आवाज़
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 4. स्क्रीन रिकॉर्डर
    async function toggleRecord() {
      const recBtn = document.getElementById('rec-btn');
      if (!isRecording) {
        recordedChunks = [];

        const recordCanvas = document.createElement('canvas');
        recordCanvas.width = 1280;
        recordCanvas.height = 720;
        const ctx = recordCanvas.getContext('2d');

        function drawFrame() {
          if (!isRecording) return;
          ctx.drawImage(video, 0, 0, recordCanvas.width, recordCanvas.height);
          ctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
          requestAnimationFrame(drawFrame);
        }

        isRecording = true;
        drawFrame();

        const canvasStream = recordCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `vlog_companion_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
          }, 100);
          statusBox.innerText = "वीडियो आपके फ़ोन में सेव हो गई है!";
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹️ रोकें व सेव करें";
        recBtn.classList.add('recording');
        statusBox.innerText = "व्लॉग रिकॉर्डिंग चालू है...";
      } else {
        isRecording = false;
        mediaRecorder.stop();
        recBtn.innerText = "⏺️ रिकॉर्डिंग";
        recBtn.classList.remove('recording');
      }
    }

    window.addEventListener('load', () => {
      startCamera();
      initThree();
    });

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
